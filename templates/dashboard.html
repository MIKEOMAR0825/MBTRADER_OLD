<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MBTrader Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">

    <header>
        <h1>MBTrader <span class="badge">TESTNET</span></h1>
    </header>

    <!-- BALANCE -->
    <div class="card">
        <h2><i class="fas fa-wallet"></i> Solde du Compte</h2>
        <div class="balance">
            <div class="balance-box">
                <p>Disponible</p>
                <span id="balance-available">0</span> USDT
            </div>
            <div class="balance-box">
                <p>Bloqué</p>
                <span id="balance-locked">0</span> USDT
            </div>
        </div>
    </div>

    <!-- BOT STATUS -->
    <div class="card">
        <h2><i class="fas fa-robot"></i> Trade Automatique</h2>
        <p id="bot-status" class="status">Chargement...</p>
        <button class="btn-toggle" onclick="toggleTrade()">ON / OFF</button>
    </div>

    <!-- PERFORMANCE -->
    <div class="card stats-card">
        <h2><i class="fas fa-chart-line"></i> Performance</h2>

        <div class="stats">

            <div class="stat-box">
                <p>Total Trades</p>
                <span id="total-trades">0</span>
            </div>

            <div class="stat-box">
                <p>PnL Total</p>
                <span id="total-pnl">0</span> USDT
            </div>
            
            <div class="stat-box">
                <p>PnL Moyen / Trade</p>
                <span id="avg-pnl">0</span> USDT
            </div>
        </div>

    </div>

    <!-- POSITIONS OUVERTES -->
    <div class="card">
        <h2><i class="fas fa-coins"></i> Positions Ouvertes</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Crypto</th>
                        <th>Entrée</th>
                        <th>Quantité</th>
                        <th>SL</th>
                        <th>TP</th>
                        <th>Type</th>
                        <th>PnL</th>
                    </tr>
                </thead>
                <tbody id="positions-open"></tbody>
            </table>
        </div>
    </div>

    <!-- TRADE HISTORY -->
    <div class="card">
        <h2><i class="fas fa-history"></i> Derniers Trades</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Heure</th>
                        <th>Action</th>
                        <th>Type</th>
                        <th>Entrée</th>
                        <th>Sortie</th>
                        <th>PnL</th>
                        <th>Status</th>

                    </tr>
                </thead>
                <tbody id="trade-history"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="/static/dashboard.js"></script>
</body>
</html>
